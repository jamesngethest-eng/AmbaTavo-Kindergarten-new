<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>School office | Ambatsavo Kindergarten</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Young+Serif&display=swap" rel="stylesheet"><link rel="icon" href="/img/favicon.png"><link rel="stylesheet" href="style.css">
<style>.fld{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}.fld label.t{margin-top:0}.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.acts .msg{min-height:0;margin:0;font-size:.9rem}.sec{margin:28px 0 10px;color:var(--moss)}.fl{margin:0!important;cursor:pointer}.gp{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.gp .fld{margin:0}.gp .thumb{height:130px}</style></head><body>
<header class="top"><a class="brand" href="/"><img class="logo" src="/img/logo.jpg" alt="">Ambatsavo office</a><div><a class="btn sm ghost" href="/" target="_blank">View site</a> <span id="who"></span> <button class="btn sm ghost" id="out">Sign out</button></div></header>
<main class="wrap portal" id="app" aria-live="polite"><p>Loading…</p></main>
<script>
const $=s=>document.querySelector(s);let T=localStorage.tk,U,C={};
const api=async(p,m='GET',b)=>{const r=await fetch('/api/'+p,{method:m,headers:{Authorization:'Bearer '+T,...(b&&!(b instanceof Blob)?{'Content-Type':'application/json'}:{})},body:b instanceof Blob?b:b&&JSON.stringify(b)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');return d};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say=(e,t,bad)=>{e.textContent=t;e.className='msg '+(bad?'err':'okc')};
const up=f=>fetch('/api/upload',{method:'POST',headers:{Authorization:'Bearer '+T,'x-filename':f.name},body:f}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error);return d});
const leave=()=>{localStorage.removeItem('tk');location.replace('/portal.html')};$('#out').onclick=leave;
const DEF={img_hero:'/img/school.jpg',img_about:'/img/classroom.jpg'};
const LBL={name:'School name',tagline:'Tagline',heroTitle:'Homepage headline',heroText:'Homepage intro',img_hero:'Homepage photo',aboutTitle:'About heading',aboutText:'About text',img_about:'About photo',prog1t:'Programme 1 title',prog1x:'Programme 1 text',prog2t:'Programme 2 title',prog2x:'Programme 2 text',prog3t:'Programme 3 title',prog3x:'Programme 3 text',communityTitle:'Community heading',communityText:'Community text',address:'Address',hours:'Opening hours',phone:'Phone (shown on site)',whatsapp:'WhatsApp number (digits only, with country code)',email:'Email',waGreeting:'WhatsApp pre-filled message'};
const SEC=[['School',['name','tagline']],['Homepage',['heroTitle','heroText','img_hero']],['About',['aboutTitle','aboutText','img_about']],['Programmes',['prog1t','prog1x','prog2t','prog2x','prog3t','prog3x']],['Community section',['communityTitle','communityText']],['Contact and WhatsApp',['address','hours','phone','whatsapp','email','waGreeting']]];
const btns='<button class="btn sm" data-save>Save</button><button class="btn sm del" data-del>Delete</button><span class="msg" role="status"></span>';
const fld=k=>k.startsWith('img_')?`<div class="fld" data-k="${k}"><label class="t">${LBL[k]}</label><div class="thumb" style="height:150px;background-image:url('${esc(C[k]||DEF[k]||'')}')"></div><input class="v" type="hidden" value="${esc(C[k])}"><div class="acts"><label class="btn sm ghost fl">Change photo<input type="file" accept="image/*" hidden></label>${btns}</div></div>`
:`<div class="fld" data-k="${k}"><label class="t">${LBL[k]}</label>${/Text|x$|Greeting/.test(k)?`<textarea class="v" rows="3">${esc(C[k])}</textarea>`:`<input class="v" value="${esc(C[k])}">`}<div class="acts">${btns}</div></div>`;
function site(){$('#tab').innerHTML=SEC.map(([h,ks])=>`<h2 class="sec">${h}</h2>`+ks.map(fld).join('')).join('')}
async function gal(){let g=[];try{g=JSON.parse(C.gallery||'')}catch{}if(!Array.isArray(g))g=[];if(!C.gallery)g=[C.img_g1,C.img_g2,C.img_g3].filter(Boolean);if(!C.gallery&&!g.length)g=['/img/bus.jpg','/img/school.jpg','/img/classroom.jpg'];
 $('#tab').innerHTML=`<h2 class="sec">Gallery photos</h2><div class="fld"><label class="t">Add pictures (you can pick several)</label><input type="file" id="ga" accept="image/*" multiple><p class="msg" id="gm" role="status"></p></div><div class="gp">${g.map((u,i)=>`<div class="fld"><div class="thumb" style="background-image:url('${esc(u)}')"></div><div class="acts"><label class="btn sm ghost fl">Change<input type="file" accept="image/*" hidden data-r="${i}"></label><button class="btn sm del" data-g="${i}">Delete</button></div></div>`).join('')||'<p>No photos yet.</p>'}</div>`;
 const m=$('#gm'),put=async()=>{C=await api('content','PUT',{gallery:JSON.stringify(g)});gal()};
 $('#ga').onchange=async e=>{try{say(m,'Uploading…');for(const f of e.target.files)g.push((await up(f)).url);await put()}catch(er){say(m,er.message,1)}};
 document.querySelectorAll('[data-r]').forEach(i=>i.onchange=async()=>{try{g[+i.dataset.r]=(await up(i.files[0])).url;await put()}catch(er){say(m,er.message,1)}});
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this photo?')){g.splice(+b.dataset.g,1);try{await put()}catch(er){say(m,er.message,1)}}})}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-save],[data-del]'),f=b&&b.closest('.fld[data-k]');if(!f)return;const k=f.dataset.k,v=f.querySelector('.v'),m=f.querySelector('.msg'),del=b.hasAttribute('data-del');
 try{if(del){if(!confirm('Delete "'+LBL[k]+'"? '+(k.startsWith('img_')?'The default picture will show instead.':'It will be empty on the website.')))return;v.value=''}
 C=await api('content','PUT',{[k]:v.value});if(k.startsWith('img_'))f.querySelector('.thumb').style.backgroundImage=`url('${C[k]||DEF[k]||''}')`;say(m,del?'Deleted.':'Saved. Live on the website.')}catch(er){say(m,er.message,1)}});
document.addEventListener('change',async e=>{const i=e.target,f=i.closest('.fld[data-k]');if(!f||i.type!=='file')return;const m=f.querySelector('.msg');try{say(m,'Uploading…');const d=await up(i.files[0]);f.querySelector('.v').value=d.url;f.querySelector('.thumb').style.backgroundImage=`url('${d.url}')`;say(m,'Photo uploaded. Press Save to publish it.')}catch(er){say(m,er.message,1)}});
const postCard=p=>`<article class="card post"><div class="meta">${new Date(p.at).toLocaleDateString()} · ${esc(p.author)}</div><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p>${p.media?(p.kind==='video'?`<video controls src="${esc(p.media)}"></video>`:`<img alt="" src="${esc(p.media)}">`):''}<button class="btn sm del" data-p="${p.id}">Delete</button></article>`;
async function feed(){const ps=await api('posts');$('#fd').innerHTML=ps.map(postCard).join('')||'<p>No updates yet.</p>';document.querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this update?')){await api('posts/'+b.dataset.p,'DELETE');feed()}})}
function upd(){$('#tab').innerHTML=`<form class="card" id="pf"><h3>Share an update</h3><label for="pt">Title</label><input id="pt" required maxlength="120"><label for="pb">Message</label><textarea id="pb" rows="3"></textarea><label for="pm">Photo or video (optional)</label><input id="pm" type="file" accept="image/*,video/*"><p><button class="btn">Share with families</button></p><p class="msg" id="pm2" role="status"></p></form><div id="fd" style="margin-top:20px"></div>`;
 pf.onsubmit=async x=>{x.preventDefault();try{let m='',k='note',f=pm.files[0];if(f){m=(await up(f)).url;k=f.type.startsWith('video')?'video':'image'}await api('posts','POST',{title:pt.value,body:pb.value,media:m,kind:k});pf.reset();say($('#pm2'),'Shared with families.');feed()}catch(er){say($('#pm2'),er.message,1)}};feed()}
async function enq(){const l=await api('enquiries');$('#tab').innerHTML=`<h2>Enquiries (${l.length})</h2>`+(l.map(e=>`<div class="row"><div><b>${esc(e.name)}</b> · ${esc(e.contact)}<br>${esc(e.message)}<div class="meta">${new Date(e.at).toLocaleString()}</div></div><button class="btn sm del" data-e="${e.id}">Delete</button></div>`).join('')||'<p>No enquiries yet.</p>');
 document.querySelectorAll('[data-e]').forEach(b=>b.onclick=async()=>{await api('enquiries/'+b.dataset.e,'DELETE');enq()})}
async function acc(){const l=(await api('users')).sort((x,y)=>!!y.pending-!!x.pending);$('#tab').innerHTML=`<h2>Accounts</h2>`+l.map(u=>`<div class="row"><div><b>${esc(u.name)}</b> · ${u.role}${u.pending?' · <span class="err">waiting for approval</span>':''}<br>${esc(u.email)} · WhatsApp ${esc(u.phone)}</div><span>${u.pending?`<button class="btn sm" data-ap="${u.id}">Approve</button> `:''}${u.id===U.id?'':`<button class="btn sm del" data-u="${u.id}">${u.pending?'Reject':'Delete'}</button>`}</span></div>`).join('')+
 `<form class="card" id="uf" style="margin-top:20px"><h3>Add an account</h3><div class="grid2"><div><label for="un">Name</label><input id="un" required></div><div><label for="ue">Email</label><input id="ue" type="email" required></div><div><label for="uph">WhatsApp number</label><input id="uph" placeholder="254700000000"></div><div><label for="ur">Role</label><select id="ur"><option>parent</option><option>teacher</option><option>admin</option></select></div><div><label for="uw">Password (8+ characters)</label><input id="uw" type="password" minlength="8" required></div></div><p><button class="btn">Add account</button></p><p class="msg" id="um" role="status"></p></form>`+pwCard;
 wirePw();document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=async()=>{try{await api('users/'+b.dataset.ap+'/approve','POST',{});acc()}catch(er){alert(er.message)}});document.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this account?')){await api('users/'+b.dataset.u,'DELETE');acc()}});
 uf.onsubmit=async x=>{x.preventDefault();try{await api('users','POST',{name:un.value,email:ue.value,phone:$('#uph').value,role:ur.value,password:uw.value});acc()}catch(er){say($('#um'),er.message,1)}}}
async function com(){const d=await api('community');$('#tab').innerHTML=`<form class="card" id="cf"><h3>Post an announcement</h3><label for="ct">Title</label><input id="ct" required maxlength="120"><label for="cb">Message</label><textarea id="cb" rows="3"></textarea><label for="cph">Photo (optional)</label><input id="cph" type="file" accept="image/*"><p><button class="btn">Post to community</button></p><p class="msg" id="cmm" role="status"></p></form><h2 class="sec">Posted announcements</h2>`+
 (d.items.map(a=>`<div class="fld" data-c="${a.id}"><label class="t">Title</label><input class="ct" value="${esc(a.title)}"><label>Message</label><textarea class="cb" rows="3">${esc(a.body)}</textarea>${a.media?`<div class="thumb" style="height:120px;background-image:url('${esc(a.media)}')"></div>`:''}<p class="meta">${new Date(a.at).toLocaleDateString()} · ${d.stickers.map(s=>s+' '+a.counts[s]).join('  ')}</p><div class="acts"><label class="btn sm ghost fl">${a.media?'Change':'Add'} photo<input type="file" accept="image/*" hidden data-cp></label><button class="btn sm" data-cs>Save</button><button class="btn sm del" data-cd>Delete</button><span class="msg"></span></div></div>`).join('')||'<p>No announcements yet.</p>');
 cf.onsubmit=async x=>{x.preventDefault();const m=$('#cmm');try{let u='';if(cph.files[0])u=(await up(cph.files[0])).url;await api('community','POST',{title:ct.value,body:cb.value,media:u});com()}catch(er){say(m,er.message,1)}}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-cs],[data-cd]'),f=b&&b.closest('[data-c]');if(!f)return;const m=f.querySelector('.msg');try{if(b.hasAttribute('data-cd')){if(!confirm('Delete this announcement and its reactions?'))return;await api('community/'+f.dataset.c,'DELETE');return com()}
 await api('community/'+f.dataset.c,'PUT',{title:f.querySelector('.ct').value,body:f.querySelector('.cb').value});say(m,'Saved.')}catch(er){say(m,er.message,1)}});
document.addEventListener('change',async e=>{const i=e.target,f=i.closest('[data-c]');if(!f||!i.hasAttribute('data-cp'))return;try{await api('community/'+f.dataset.c,'PUT',{media:(await up(i.files[0])).url});com()}catch(er){say(f.querySelector('.msg'),er.message,1)}});
const pwCard=`<form class="card" id="pwf" style="margin-top:34px;max-width:460px"><h3>Change my password</h3><label for="pc">Current password</label><input id="pc" type="password" required><label for="pn">New password (8+ characters)</label><input id="pn" type="password" minlength="8" required><p><button class="btn">Change password</button></p><p class="msg" id="pwm" role="status"></p></form>`;
function wirePw(){$('#pwf').onsubmit=async x=>{x.preventDefault();try{await api('password/change','POST',{current:$('#pc').value,password:$('#pn').value});$('#pwf').reset();say($('#pwm'),'Password changed.')}catch(er){say($('#pwm'),er.message,1)}}}
const TABS={Website:site,Gallery:gal,Community:com,Updates:upd,Enquiries:enq,Accounts:acc};
(async()=>{try{U=await api('me');if(U.role!=='admin')return location.replace('/portal.html');C=await (await fetch('/api/content')).json()}catch{return location.replace('/portal.html')}
 $('#who').textContent=U.name;$('#app').innerHTML=`<h1>School office</h1><div class="tabs">${Object.keys(TABS).map((t,i)=>`<button class="btn${i?'':' on'}" data-t="${t}">${t}</button>`).join('')}</div><div id="tab"></div>`;
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));TABS[b.dataset.t]()});site();api('users').then(l=>{const n=l.filter(u=>u.pending).length;if(n)document.querySelector('[data-t="Accounts"]').textContent='Accounts ('+n+' new)'}).catch(()=>{})})();
</script></body></html>
